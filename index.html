<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>2026년 과장 리더십 과정 Remind Letter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: #f4f6f8;
      color: #17324d;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 38px 24px;
      box-shadow: 0 10px 32px rgba(0,0,0,.10);
      text-align: center;
    }
    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      color: #0b4a6f;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.35;
    }
    p {
      margin: 0 0 28px;
      color: #607284;
      line-height: 1.65;
      font-size: 15px;
    }
    .buttons {
      display: grid;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
    }
    .view {
      background: #0b4a6f;
      color: #fff;
    }
    .download {
      background: #fff;
      color: #0b4a6f;
      border: 2px solid #0b4a6f;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #8895a3;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">국세공무원교육원</div>
    <h1>2026년 과장 리더십 과정<br>Remind Letter</h1>
    <p>교육에서 학습한 내용을 다시 확인하고<br>현업에서 활용해 보세요.</p>

    <div class="buttons">
      <a class="btn view" href="./remind-letter.pdf?v=2" target="_blank" rel="noopener">
        PDF 보기
      </a>
      <a class="btn download" href="./remind-letter.pdf?v=2" download="2026_과장리더십_리마인드레터.pdf">
        PDF 다운로드
      </a>
    </div>

    <div class="note">※ 모바일 환경에 따라 다운로드 시 PDF가 먼저 열릴 수 있습니다.</div>
  </main>
</body>
</html>
