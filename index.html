<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026년 과장 리더십 과정 Remind Letter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: #f4f6f8;
      color: #17324d;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 26px 20px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.35;
    }
    .sub {
      margin: 0 0 24px;
      color: #5c6f82;
      font-size: 15px;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      min-width: 180px;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .view {
      background: #0b4a6f;
      color: #fff;
    }
    .download {
      background: #fff;
      color: #0b4a6f;
      border: 2px solid #0b4a6f;
    }
    .viewer {
      width: 100%;
      height: 70vh;
      min-height: 560px;
      border: 1px solid #dfe6ec;
      border-radius: 12px;
    }
    .note {
      margin-top: 14px;
      color: #7b8794;
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 640px) {
      h1 { font-size: 21px; }
      .card { padding: 22px 14px; }
      .btn { width: 100%; }
      .viewer { height: 62vh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>2026년 과장 리더십 과정<br>Remind Letter</h1>
      <p class="sub">교육에서 학습한 내용을 다시 한번 확인하고 현업에서 활용해 보세요.</p>

      <div class="buttons">
        <a class="btn view" href="remind-letter.pdf" target="_blank" rel="noopener">PDF 크게 보기</a>
        <a class="btn download" href="remind-letter.pdf" download="2026_과장리더십_리마인드레터.pdf">PDF 다운로드</a>
      </div>

      <iframe class="viewer" src="remind-letter.pdf" title="과장 리더십 과정 리마인드 레터"></iframe>

      <p class="note">
        모바일 브라우저 환경에 따라 ‘PDF 다운로드’ 선택 시 PDF가 먼저 열릴 수 있습니다.
        이 경우 브라우저의 공유/저장 메뉴에서 파일로 저장할 수 있습니다.
      </p>
    </div>
  </div>
</body>
</html>
